name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"

      - name: Validate release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ERROR: KEYSTORE_BASE64 is empty"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "ERROR: STORE_PASSWORD is empty"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ERROR: KEY_PASSWORD is empty"; exit 1; }

          test -s "$GITHUB_WORKSPACE/my-upload-key.jks" || {
            echo "ERROR: keystore file is empty"
            exit 1
          }

          keytool -list             -keystore "$GITHUB_WORKSPACE/my-upload-key.jks"             -storetype JKS             -storepass "$STORE_PASSWORD"             -alias upload

          keytool -certreq             -keystore "$GITHUB_WORKSPACE/my-upload-key.jks"             -storetype JKS             -storepass "$STORE_PASSWORD"             -keypass "$KEY_PASSWORD"             -alias upload             -file /tmp/fmc-timbang-upload.csr

          rm -f /tmp/fmc-timbang-upload.csr

          echo "PASS: release keystore, store password, key password, and alias upload are valid"

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Verify APK identity
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          echo "Checking APK: $APK"

          PACKAGE=$(apkanalyzer manifest application-id "$APK")
          echo "Application ID: $PACKAGE"

          if [ "$PACKAGE" != "com.aistudio.timbangayam.kxqz" ]; then
            echo "ERROR: Unexpected Application ID: $PACKAGE"
            echo "Expected: com.aistudio.timbangayam.kxqz"
            exit 1
          fi

          echo "PASS: APK belongs to FMC-Timbang-Broiler"

          echo "Signing certificate:"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FMC-Timbang-Broiler-release
          path: app/build/outputs/apk/release/*.apk

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FMC-Timbang-Broiler-debug
          path: app/build/outputs/apk/debug/app-debug.apk
